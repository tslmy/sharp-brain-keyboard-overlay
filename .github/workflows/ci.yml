name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [armel, armhf]
    steps:
      - uses: actions/checkout@v5
      - name: Host tests
        run: make test
      - name: Build ${{ matrix.arch }} Debian package
        run: make deb DEB_ARCH="${{ matrix.arch }}"
      - name: Verify packaged ARM binary
        run: |
          docker run --rm --platform linux/amd64 \
            -v "$PWD/dist":/out:ro \
            --entrypoint sh keyoverlay-deb-builder:local \
            tests/package.sh "/out/keyoverlay_${{ matrix.arch }}.deb" "" "${{ matrix.arch }}"