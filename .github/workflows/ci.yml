name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Host tests
        run: make test
      - name: Build armel Debian package
        run: make deb
      - name: Verify packaged ARM binary
        run: |
          docker run --rm --platform linux/amd64 \
            -v "$PWD/dist":/out:ro \
            --entrypoint sh keyoverlay-deb-builder:local \
            tests/package.sh /out/keyoverlay_armel.deb